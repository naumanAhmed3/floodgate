name: CI
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: floodgate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d floodgate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/floodgate_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting
        run: |
          files="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: PostgreSQL tests
        run: |
          : "${TEST_DATABASE_URL:?TEST_DATABASE_URL is required}"
          go test -count=1 -v ./...
      - name: Missing database configuration must fail
        run: |
          if env -u TEST_DATABASE_URL go test -count=1 \
            -run '^Test(TokenBucketUsesProvidedTime|SlidingWindowUsesProvidedTime)$' \
            ./pkg/ratelimit >missing-db.log 2>&1; then
            cat missing-db.log
            exit 1
          fi
          cat missing-db.log
          grep -Fq -- '--- FAIL: TestTokenBucketUsesProvidedTime' missing-db.log
          grep -Fq -- '--- FAIL: TestSlidingWindowUsesProvidedTime' missing-db.log
          grep -Fq 'TEST_DATABASE_URL is required' missing-db.log
